<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">Browser Control MCP</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f7f9;
      --panel-border: #e2e5ea;
      --inset: #eceef2;
      --text: #1b1d21;
      --muted: #6b7280;
      --accent: #7928ca;
      --accent-soft: rgba(121, 40, 202, 0.12);
      --ok: #12a150;
      --danger: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181c;
        --panel: #202127;
        --panel-border: #2e3038;
        --inset: #16171b;
        --text: #eceef2;
        --muted: #9aa1ac;
        --accent: #a855f7;
        --accent-soft: rgba(168, 85, 247, 0.18);
        --ok: #35c46b;
        --danger: #f87171;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      max-width: 760px;
      overflow-x: hidden;
      margin: 0 auto;
      padding: 28px 20px 60px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 13px;
    }

    .notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 11px 14px;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .notice b {
      color: var(--accent);
    }

    .section-container {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 6px 16px 14px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text);
      margin: 0;
      padding: 12px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    h2::after {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      opacity: 0.5;
      background-image: url("assets/caret.svg");
      background-size: contain;
      background-repeat: no-repeat;
      transition: transform 0.2s ease;
    }

    h2.collapsed::after {
      transform: rotate(180deg);
    }

    .section-content {
      transition: max-height 0.3s ease, opacity 0.3s ease;
      max-height: 3000px;
      opacity: 1;
      overflow: hidden;
      padding-bottom: 4px;
    }

    .section-content.collapsed {
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .section-content > p:first-child {
      margin-top: 0;
    }

    p {
      color: var(--muted);
      font-size: 13px;
    }

    h3 {
      font-size: 13px;
      margin: 18px 0 6px;
      color: var(--text);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      background: var(--inset);
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      padding: 1px 5px;
    }

    pre {
      background: var(--inset);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 11px 13px;
      max-width: 100%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text);
    }

    @media (max-width: 620px) {
      body {
        padding: 20px 12px 40px;
      }

      .section-container {
        padding: 4px 12px 12px;
      }
    }

    .secret-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .secret-value {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.04em;
      word-break: break-all;
      background: var(--inset);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }

    .secret-value.is-masked {
      color: var(--muted);
    }

    .secret-eye {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      padding: 0;
      color: var(--muted);
    }

    .secret-eye:hover:not(:disabled),
    .secret-eye:focus-visible:not(:disabled) {
      color: var(--accent);
    }

    .secret-eye:disabled {
      opacity: 0.5;
      cursor: default;
    }

    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: var(--bg);
      color: var(--text);
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.is-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.is-primary:hover {
      color: #fff;
      filter: brightness(1.1);
    }

    input[type="text"],
    textarea {
      width: 100%;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--text);
      background: var(--inset);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .status {
      margin-top: 10px;
      color: var(--ok);
      font-size: 12.5px;
      min-height: 18px;
    }

    .tool-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid var(--panel-border);
    }

    .tool-row:last-child {
      border-bottom: none;
    }

    .tool-label-container {
      flex: 1;
      min-width: 0;
    }

    .tool-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .tool-description {
      font-size: 12.5px;
      color: var(--muted);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 23px;
      flex: 0 0 auto;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--panel-border);
      transition: .25s;
      border-radius: 23px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 17px;
      width: 17px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .25s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: var(--accent);
    }

    input:focus-visible+.slider {
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input:checked+.slider:before {
      transform: translateX(19px);
    }

    .loading {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 0;
    }

    .permission-modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .permission-modal.hidden {
      display: none;
    }

    .permission-modal-content {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      max-width: 460px;
      width: 90%;
      text-align: center;
    }

    .permission-modal h2 {
      font-size: 16px;
      margin: 0 0 14px;
      padding: 0;
      cursor: default;
      justify-content: center;
    }

    .permission-modal h2::after {
      display: none;
    }

    .permission-domain {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--inset);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      display: inline-block;
      margin: 0 4px;
      font-weight: 600;
      word-break: break-all;
    }

    .permission-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
    }

    .main-content.modal-open {
      filter: blur(2px);
      pointer-events: none;
    }

    #audit-log-container {
      max-height: 340px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .audit-log-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 13px;
    }

    .audit-log-table th,
    .audit-log-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--panel-border);
    }

    .audit-log-table th {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .audit-log-table td {
      color: var(--text);
    }

    .audit-log-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
    }

    .audit-log-timestamp {
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
    }

    .audit-log-empty {
      text-align: center;
      color: var(--muted);
      padding: 20px;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div id="permission-modal" class="permission-modal hidden">
    <div class="permission-modal-content">
      <h2 data-i18n="optionsModalTitle"></h2>
      <p data-i18n="optionsModalIntro"></p>
      <div class="permission-domain" id="permission-domain"></div>
      <p id="permission-text" data-i18n="optionsModalTextDomain"></p>
      <div class="permission-buttons">
        <button id="grant-btn" class="is-primary" data-i18n="optionsModalGrant"></button>
        <button id="cancel-btn" data-i18n="optionsModalCancel"></button>
      </div>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <h1 data-i18n="optionsTitle"></h1>

    <div class="section-container">
      <h2 data-i18n="optionsSecretHeading"></h2>
      <div class="section-content">
        <div class="secret-row">
          <button id="regenerate-secret" type="button" data-i18n="optionsSecretRegenerate"></button>
          <div class="secret-value is-masked" id="secret-display" data-i18n="optionsSecretLoading"></div>
          <button class="secret-eye" id="reveal-secret" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button class="is-primary" id="copy-button" type="button" data-i18n="optionsSecretCopy"></button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="section-container">
      <h2 data-i18n="optionsToolsHeading"></h2>
      <div class="section-content">
        <div id="tool-settings-container">
          <div class="loading" data-i18n="optionsToolsLoading"></div>
        </div>
      </div>
    </div>



    <div class="section-container">
      <h2 class="collapsed" role="button" aria-expanded="false" tabindex="0" id="audit-log-header" data-i18n="optionsAuditHeading"></h2>
      <div class="section-content collapsed" aria-labelledby="audit-log-header">
        <div id="audit-log-container">
          <div class="loading" data-i18n="optionsAuditLoading"></div>
        </div>
        <div style="margin-top: 14px;">
          <button id="clear-audit-log" type="button" data-i18n="optionsAuditClear"></button>
          <div class="status" id="audit-log-status"></div>
        </div>
      </div>
    </div>

    <div class="section-container">
      <h2 class="collapsed" data-i18n="optionsInstallHeading"></h2>
      <div class="section-content collapsed">
        <p data-i18n-html="optionsInstallBody"></p>

        <h3>Claude Code</h3>
        <pre data-i18n="optionsInstallCodeSnippet"></pre>

        <h3>Claude Desktop</h3>
        <p data-i18n-html="optionsInstallDesktopBody"></p>
        <pre data-i18n="optionsInstallDesktopSnippet"></pre>

        <h3 data-i18n="optionsInstallDxtHeading"></h3>
        <p data-i18n-html="optionsInstallDxtBody"></p>
      </div>
    </div>
  </div>

  <script src="dist/options.js"></script>
</body>

</html>
